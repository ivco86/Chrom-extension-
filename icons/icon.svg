<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#grad)"/>

  <!-- Download arrow -->
  <g transform="translate(64, 64)">
    <!-- Arrow shaft -->
    <rect x="-8" y="-35" width="16" height="40" fill="white" rx="4"/>

    <!-- Arrow head -->
    <path d="M -25,10 L 0,35 L 25,10 Z" fill="white"/>

    <!-- Tray -->
    <rect x="-30" y="20" width="60" height="8" fill="white" opacity="0.7" rx="2"/>
  </g>

  <!-- Image icon overlay -->
  <g transform="translate(24, 20)" opacity="0.3">
    <rect width="24" height="20" fill="white" rx="2"/>
    <circle cx="8" cy="7" r="3" fill="#667eea"/>
    <path d="M 0,14 L 8,8 L 16,12 L 24,8 L 24,20 L 0,20 Z" fill="#667eea"/>
  </g>
</svg>
